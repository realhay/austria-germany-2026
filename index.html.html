*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f2f2f5;--card:#fff;--text:#1c1c1e;--text2:#6b6b70;--line:#e5e5ea;--accent:#1d6fe8;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04)}

header{padding:24px 20px 8px}

header .sub{margin:0;font-size:13px;color:var(--text2)}
.now-card{margin:16px 16px 0;background:var(--card);border-radius:18px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.now-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#ff6b6b,#ffa94d,#51cf66,#339af0,#9775fa);background-size:200% 100%;animation:shimmer 8s linear infinite}

.now-label{font-size:11px;font-weight:600;letter-spacing:1.5px;color:var(--text2);text-transform:uppercase;margin-bottom:8px}
.now-event{font-size:19px;font-weight:700;margin-bottom:4px;line-height:1.3}
.now-note{font-size:13px;color:var(--text2);margin-bottom:16px;min-height:20px}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd-cell{background:var(--bg);border-radius:12px;padding:10px 4px;text-align:center}
.cd-num{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.cd-unit{font-size:11px;color:var(--text2);margin-top:2px}
.now-time{font-size:12px;color:var(--text2);margin-top:12px;text-align:center}
.section{margin:28px 16px 0}

.map-wrap{background:var(--card);border-radius:18px;padding:16px 12px 10px;box-shadow:var(--shadow);overflow:hidden}
.map-svg{width:100%;height:auto;display:block}

.map-svg .city-dot,.mini-map .city-dot{fill:var(--card)}

.legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:14px 4px 4px;font-size:11px;color:var(--text2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.booking-group{margin-bottom:14px}
.bg-title{font-size:13px;font-weight:600;color:var(--text2);margin:0 0 8px 4px}
.booking{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:8px;box-shadow:var(--shadow)}

.b-code{font-size:15px;font-weight:700;color:var(--text);text-decoration:none;border-bottom:1px dashed var(--line)}

.tl-title a:active{border-bottom-color:var(--accent);color:var(--accent)}

.shop-name{font-size:13.5px;font-weight:600;line-height:1.4}

.todo-list{background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}

.todo-list ul{margin:0;padding:0 0 0 18px;list-style:none}

.todo-list li::before{content:'';position:absolute;left:-14px;top:12px;width:5px;height:5px;border-radius:50%;background:var(--text2)}

footer{text-align:center;font-size:11.5px;color:var(--text2);margin:32px 16px 16px;line-height:1.6}

function gmap(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);}
function gdir(list){return 'https://www.google.com/maps/dir/?api=1&'+list.map(function(p,i){return (i===0?'origin=':'destination=')+encodeURIComponent(p);}).join('&');}

var bEl = document.getElementById('bookings'), bHtml = '';
BOOKINGS.forEach(function(g){
  bHtml += '<div class="booking-group"><div class="bg-title">'+g.icon+' '+g.label+'</div>';
  g.items.forEach(function(it){
    bHtml += '<div class="booking"><div class="b-head">';
    if(it.pmap) bHtml += '<a class="b-code" href="'+gmap(it.pmap)+'" target="_blank" rel="noopener">'+it.code+' ↗</a>';
    else bHtml += '<span class="b-code">'+it.code+'</span>';
    bHtml += '<span class="b-date">'+it.date+'</span></div>';
    bHtml += '<div class="b-route">'+it.route+'</div>';
    if(it.note) bHtml += '<div class="b-note">'+it.note+'</div>';
    if(it.addr) bHtml += '<div class="b-addr">📍 '+it.addr+'</div>';
    if(it.tel) bHtml += '<a class="b-tel" href="tel:'+it.tel.split(' / ')[0].replace(/\s/g,'')+'">📞 '+it.tel+'</a>';
    if(it.pmap) bHtml += '<a class="b-map" href="'+gmap(it.pmap)+'" target="_blank" rel="noopener">🗺 打开地图</a>';
    bHtml += '</div>';
  });
  bHtml += '</div>';
});
bEl.innerHTML = bHtml;

/* 逐日 */
var dEl = document.getElementById('days'), dHtml = '';
DAYS.forEach(function(day, idx){
  dHtml += '<div class="day" data-idx="'+idx+'" style="--day-color:'+day.color+'">';
  dHtml += '<div class="day-head"><div class="day-left"><div class="day-num">DAY '+day.n+'</div><div class="day-date">'+day.date+' '+day.wd+'</div></div>';
  dHtml += '<div class="day-right"><div class="day-title">'+day.title+'</div><div class="day-meta">住 '+day.stay+' · '+day.drive+'</div></div>';
  dHtml += '<svg class="day-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></div>';
  dHtml += '<div class="day-body">';

  if(day.route && day.route.length > 1){
    dHtml += '<div class="day-map-top"><svg class="mini-map" viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg">';
    var pts = day.route.map(function(n){return CITY[n];}).filter(Boolean);
    for(var i=0;i<pts.length-1;i++){
      dHtml += '<line x1="'+pts[i][0]+'" y1="'+pts[i][1]+'" x2="'+pts[i+1][0]+'" y2="'+pts[i+1][1]+'" stroke="'+day.color+'" stroke-width="4" stroke-linecap="round" opacity=".85"/>';
    }
    pts.forEach(function(p){
      dHtml += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="9" fill="var(--card)" stroke="'+day.color+'" stroke-width="4"/>';
    });
    dHtml += '</svg>';
    dHtml += '<a class="nav-btn" href="'+gdir(day.route)+'" target="_blank" rel="noopener">🧭 一键导航全天路线（'+day.route.length+' 点）</a>';
    dHtml += '</div>';
  }

  dHtml += '<div class="tl">';
  day.items.forEach(function(it){
    dHtml += '<div class="tl-item"><div class="tl-time">'+it.t+'</div><div class="tl-title">';
    if(it.p) dHtml += '<a href="'+gmap(it.p)+'" target="_blank" rel="noopener">'+it.s+'</a>';
    else dHtml += it.s;
    if(it.must) dHtml += '<span class="tl-must">提前</span>';
    dHtml += '</div>';
    if(it.d) dHtml += '<div class="tl-note">'+it.d+'</div>';
    dHtml += '</div>';
  });
  dHtml += '</div>';

  if(day.alt) dHtml += '<div class="tl-note" style="margin-top:12px;padding:10px 12px;background:var(--bg);border-radius:10px;border-left:3px solid '+day.color+'">'+day.alt+'</div>';
  dHtml += '</div></div>';
});
dEl.innerHTML = dHtml;

dEl.addEventListener('click', function(e){
  if(e.target.closest('a')) return;
  var head = e.target.closest('.day-head');
  if(!head) return;
  head.parentElement.classList.toggle('open');
});

/* 倒计时 */
var nowEvent = document.getElementById('nowEvent'), nowNote = document.getElementById('nowNote'),
    nowTime = document.getElementById('nowTime'),
    cdD=document.getElementById('cdD'),cdH=document.getElementById('cdH'),
    cdM=document.getElementById('cdM'),cdS=document.getElementById('cdS');
var TS = EVENTS.map(function(e){return {t:new Date(e.ts).getTime(), e:e};});
function pad(n){return n<10?'0'+n:''+n;}

function tick(){
  var now = Date.now(), nxt = null;
  for(var i=0;i<TS.length;i++){ if(TS[i].t > now){ nxt = TS[i]; break; } }
  if(!nxt){
    nowEvent.textContent = '行程已完成';
    nowNote.textContent = '';
    cdD.textContent = cdH.textContent = cdM.textContent = cdS.textContent = '—';
  } else {
    nowEvent.textContent = nxt.e.title;
    nowNote.textContent = nxt.e.note || '';
    var diff = nxt.t - now;
    cdD.textContent = Math.floor(diff/86400000);
    cdH.textContent = pad(Math.floor((diff%86400000)/3600000));
    cdM.textContent = pad(Math.floor((diff%3600000)/60000));
    cdS.textContent = pad(Math.floor((diff%60000)/1000));
  }
  nowTime.textContent = '你所在时区：' + new Date().toLocaleString('zh-CN',{hour12:false});
}
tick(); setInterval(tick, 1000);

})();
